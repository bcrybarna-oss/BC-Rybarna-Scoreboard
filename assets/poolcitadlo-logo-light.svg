<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Poolčítadlo by BC Rybárna</title>
  <desc id="desc">Světlá varianta loga Poolčítadlo pro světlý režim.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9a6814"/>
      <stop offset=".45" stop-color="#d6aa49"/>
      <stop offset="1" stop-color="#f0cf74"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" x2="1">
      <stop offset="0" stop-color="#6f4b0f"/>
      <stop offset="1" stop-color="#b78627"/>
    </linearGradient>
    <radialGradient id="ballBlack" cx=".35" cy=".28" r=".75">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset=".4" stop-color="#202020"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="ballGold" cx=".35" cy=".28" r=".75">
      <stop offset="0" stop-color="#f6db8a"/>
      <stop offset=".48" stop-color="#d7a538"/>
      <stop offset="1" stop-color="#79510c"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <g transform="translate(28 25)" filter="url(#softShadow)">
    <path d="M110 12 L12 195 Q5 208 20 208 H202 Q217 208 210 195 Z" fill="#fbfaf6" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M110 31 L30 187 H190 Z" fill="#f2eee5" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="110" cy="60" r="25" fill="url(#ballGold)"/>
    <circle cx="82" cy="104" r="24" fill="url(#ballBlack)"/>
    <circle cx="138" cy="104" r="24" fill="url(#ballBlack)"/>
    <circle cx="55" cy="150" r="24" fill="url(#ballGold)"/>
    <circle cx="110" cy="150" r="25" fill="url(#ballBlack)"/>
    <circle cx="165" cy="150" r="24" fill="url(#ballGold)"/>
    <circle cx="110" cy="150" r="12" fill="#f7f7f3"/>
    <text x="110" y="156" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="900" fill="#111">8</text>
    <g opacity=".28" fill="#fff">
      <circle cx="102" cy="51" r="7"/>
      <circle cx="75" cy="96" r="6"/>
      <circle cx="131" cy="96" r="6"/>
      <circle cx="48" cy="142" r="6"/>
      <circle cx="103" cy="141" r="6"/>
      <circle cx="158" cy="142" r="6"/>
    </g>
  </g>

  <g transform="translate(275 60)">
    <text x="0" y="104" font-family="Arial,Segoe UI,sans-serif" font-size="103" font-weight="300" letter-spacing="-6" fill="#171717">Pool</text>
    <text x="214" y="104" font-family="Arial,Segoe UI,sans-serif" font-size="103" font-weight="300" letter-spacing="-6" fill="url(#gold)">čítadlo</text>

    <g transform="translate(7 130)">
      <rect x="0" y="0" width="575" height="8" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="22" height="8" rx="4" fill="url(#gold)"/>
      <rect x="29" y="0" width="5" height="8" fill="#d6aa49"/>
      <rect x="42" y="0" width="5" height="8" fill="#d6aa49"/>
      <rect x="516" y="0" width="20" height="8" fill="url(#goldDark)"/>
      <rect x="544" y="0" width="5" height="8" fill="#d6aa49"/>
      <rect x="555" y="0" width="5" height="8" fill="#d6aa49"/>
    </g>

    <text x="573" y="179" text-anchor="end" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="500" letter-spacing="3" fill="#7b6340">by BC Rybárna</text>
  </g>
</svg>