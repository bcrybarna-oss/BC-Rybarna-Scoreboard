<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BC Rybárna Overlay • v4.50.85 RC</title>
<style>
  :root{
    --gold:#d4af37;
    --gold2:#f1d67a;
    --bg:rgba(12,12,16,.78);
    --panel:rgba(22,22,30,.88);
    --line:rgba(255,255,255,.10);
    --text:#f7f7fb;
    --muted:#c9cad4;
    --accent:#ee3b44;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  body{position:fixed;inset:0;background:transparent}
  #stage{position:fixed;inset:0;width:100vw;height:100dvh;background:transparent;overflow:hidden}
  #overlay{position:fixed;inset:0;display:none;z-index:10}
  #overlay.active{display:block}
  .live-wrap{position:absolute;left:clamp(10px,2vw,32px);right:clamp(10px,2vw,32px);bottom:clamp(10px,2vh,24px)}
  .titlebar{display:flex;justify-content:center;align-items:center;margin-bottom:12px}
  .titlepill{max-width:92%;padding:clamp(5px,1vh,10px) clamp(10px,2vw,20px);border-radius:999px;background:rgba(0,0,0,.56);border:2px solid rgba(212,175,55,.45);color:var(--gold2);font-size:clamp(12px,2.2vw,24px);font-weight:900;letter-spacing:.5px;text-shadow:0 2px 4px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scoreboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,22vw) minmax(0,1fr);gap:clamp(6px,1.4vw,16px);align-items:stretch;background:var(--bg);border:2px solid rgba(255,255,255,.12);border-radius:clamp(12px,2vw,24px);padding:clamp(8px,1.5vw,18px) clamp(8px,1.8vw,22px);box-shadow:0 20px 60px rgba(0,0,0,.34)}
  .player{display:flex;align-items:center;gap:clamp(6px,1.2vw,14px);background:var(--panel);border:1px solid var(--line);border-radius:clamp(10px,1.8vw,20px);padding:clamp(8px,1.4vw,16px);min-height:clamp(64px,14vh,108px);position:relative}
  .player.turn{outline:3px solid rgba(212,175,55,.88);box-shadow:0 0 0 5px rgba(212,175,55,.16) inset}
  .player.turn::after{content:'U STOLU';position:absolute;top:-10px;right:10px;background:rgba(212,175,55,.98);color:#111;padding:4px 9px;border-radius:999px;font-size:clamp(8px,1.2vw,12px);font-weight:900;letter-spacing:.8px}
  .player.right{flex-direction:row-reverse;text-align:right}
  .identity{min-width:0;flex:1}
  .name{font-size:clamp(16px,3.2vw,38px);line-height:1.04;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.55)}
  .sub{font-size:clamp(10px,1.6vw,18px);color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score{min-width:clamp(42px,7vw,78px);text-align:center;font-size:clamp(30px,6vw,64px);font-weight:1000;line-height:1;color:var(--gold2);text-shadow:0 3px 5px rgba(0,0,0,.6)}
  .center{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:6px}
  .maininfo{font-size:clamp(12px,2vw,22px);font-weight:950;letter-spacing:.5px;text-align:center}
  .subinfo{font-size:clamp(9px,1.4vw,15px);color:var(--muted);text-align:center}.breakinfo{font-size:clamp(8px,1.05vw,12px);color:rgba(220,220,228,.68);text-align:center;font-weight:750;letter-spacing:.04em;white-space:nowrap}
  .rack{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:clamp(9px,1.3vw,14px);font-weight:850;letter-spacing:.8px}
  .balls-wrap{margin-top:clamp(5px,1vh,10px);padding:clamp(6px,1vw,10px);border-radius:clamp(10px,1.5vw,18px);background:rgba(8,8,12,.66);border:1px solid rgba(255,255,255,.10)}
  .balls-title{font-size:clamp(8px,1vw,12px);font-weight:900;color:var(--muted);letter-spacing:1px;margin-bottom:10px;text-align:center}
  .balls-row{display:flex;justify-content:center;gap:clamp(4px,1vw,10px);flex-wrap:nowrap}
  .ball-slot{width:clamp(28px,5vw,54px);height:clamp(28px,5vw,54px);display:flex;align-items:center;justify-content:center}
  .ball{--ball-color:#f4d000;width:clamp(26px,4.7vw,52px);height:clamp(26px,4.7vw,52px);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible;
    background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.98) 0 4%,rgba(255,255,255,.58) 5% 9%,rgba(255,255,255,.12) 16%,transparent 27%),radial-gradient(circle at 44% 36%,color-mix(in srgb,var(--ball-color) 82%,white 18%) 0 48%,var(--ball-color) 67%,color-mix(in srgb,var(--ball-color) 72%,black 28%) 100%);
    box-shadow:inset -8px -10px 15px rgba(0,0,0,.28),inset 6px 7px 13px rgba(255,255,255,.28),0 8px 14px rgba(0,0,0,.38);transition:opacity .18s ease,transform .18s ease}
  .ball::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -3px 8px rgba(0,0,0,.14)}
  .ball span{position:relative;z-index:4;width:clamp(13px,2vw,22px);height:clamp(13px,2vw,22px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 38% 30%,#fff 0 58%,#ededed 78%,#cfcfcf 100%);color:#111;font-weight:1000;font-size:clamp(8px,1.2vw,12px);line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.38),inset 0 0 0 1px rgba(0,0,0,.08);font-family:Arial,Helvetica,sans-serif}
  .ball.stripe{background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.98) 0 4%,rgba(255,255,255,.62) 5% 9%,rgba(255,255,255,.10) 16%,transparent 27%),linear-gradient(to bottom,#f6f6f2 0 27%,var(--ball-color) 27% 73%,#f5f5f1 73% 100%);box-shadow:inset -8px -10px 15px rgba(0,0,0,.22),inset 6px 7px 13px rgba(255,255,255,.32),0 8px 14px rgba(0,0,0,.38)}
  .ball.gone{opacity:.12;transform:scale(.82);filter:grayscale(.45)}
  .ball1{--ball-color:#f4d21d}.ball2{--ball-color:#154cba}.ball3{--ball-color:#c62828}.ball4{--ball-color:#6b3aa8}.ball5{--ball-color:#ef7f22}.ball6{--ball-color:#1f8a4c}.ball7{--ball-color:#7d1f2b}.ball8{--ball-color:#101010}.ball9{--ball-color:#f4d21d}.ball10{--ball-color:#154cba}
  .intermission{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,48px);background:radial-gradient(circle at 50% 35%,rgba(48,42,24,.95),rgba(5,5,8,.99) 62%);text-align:center}
  .intermission-card{width:min(88vw,1100px);padding:clamp(28px,8vh,72px) clamp(18px,4vw,48px);border-radius:42px;border:2px solid rgba(212,175,55,.48);background:rgba(10,10,14,.76);box-shadow:0 35px 110px rgba(0,0,0,.48),inset 0 0 100px rgba(212,175,55,.04)}
  .intermission-kicker{font-size:clamp(16px,3vw,30px);letter-spacing:6px;font-weight:900;color:var(--gold2);margin-bottom:28px}
  .intermission-main{font-size:clamp(48px,12vw,130px);font-weight:1000;letter-spacing:4px;line-height:.95;text-shadow:0 5px 18px rgba(0,0,0,.52)}
  .intermission-sub{margin-top:clamp(12px,3vh,28px);font-size:clamp(18px,4vw,40px);font-weight:850;color:#ddd;letter-spacing:1px}
  .offline{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#ddd;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .diag{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:99999;padding:8px 14px;border-radius:999px;background:#b00020;color:#fff;font-size:clamp(12px,2vw,18px);font-weight:900;letter-spacing:.7px;display:none}.diag.show{display:block}

  @media (orientation:portrait){
    .live-wrap{left:8px;right:8px;bottom:10px}
    .scoreboard{grid-template-columns:minmax(0,1fr) minmax(76px,20vw) minmax(0,1fr);gap:5px;padding:7px}
    .player{padding:7px;min-height:62px}
    .name{font-size:clamp(13px,4vw,22px)}
    .sub{font-size:clamp(8px,2.6vw,12px)}
    .score{font-size:clamp(27px,8vw,42px);min-width:34px}
    .center{gap:4px;padding:2px}
    .maininfo{font-size:clamp(9px,2.8vw,13px)}
    .rack,.subinfo{font-size:clamp(7px,2vw,10px)}
    .balls-wrap{padding:5px;margin-top:5px}
    .balls-title{margin-bottom:5px}
    .balls-row{gap:3px}
    .ball-slot{width:clamp(22px,7vw,32px);height:clamp(22px,7vw,32px)}
    .ball{width:clamp(21px,6.6vw,31px);height:clamp(21px,6.6vw,31px)}
    .ball span{width:clamp(11px,3.2vw,15px);height:clamp(11px,3.2vw,15px);font-size:clamp(7px,2vw,9px)}
  }
  @media (orientation:landscape){
    .live-wrap{left:clamp(12px,2vw,28px);right:clamp(12px,2vw,28px);bottom:clamp(8px,1.5vh,16px)}
    .player{min-height:clamp(58px,18vh,96px)}
    .balls-wrap{margin-top:6px}
  }


  .audio-status{margin-top:18px;font-size:clamp(10px,1.4vw,15px);font-weight:900;letter-spacing:.08em;color:rgba(255,255,255,.72)}
  .scoreboard{grid-template-rows:auto auto}
  .balls-wrap{
    grid-column:1/-1;
    margin-top:0!important;
    padding:4px 8px!important;
    border-radius:10px!important;
    background:rgba(255,255,255,.035)!important;
    border:1px solid rgba(255,255,255,.07)!important;
  }
  .balls-title{display:none!important}
  .balls-row{gap:clamp(3px,.7vw,7px)!important}
  .ball-slot{width:clamp(24px,3.2vw,34px)!important;height:clamp(24px,3.2vw,34px)!important}
  .ball{width:clamp(23px,3vw,32px)!important;height:clamp(23px,3vw,32px)!important}
  .ball span{width:clamp(11px,1.45vw,15px)!important;height:clamp(11px,1.45vw,15px)!important;font-size:clamp(7px,.8vw,9px)!important}
  .live-wrap{bottom:clamp(6px,1vh,12px)!important}
  .player{min-height:clamp(54px,11vh,78px)!important}
  .scoreboard{padding:clamp(6px,1vw,10px)!important;gap:clamp(4px,.8vw,8px)!important}
  .center{gap:3px!important;padding:2px 4px!important}

</style>
</head>
<body>
  <div id="stage">
    <div id="diag" class="diag"></div>
    <div id="overlay"><div class="offline">Overlay čeká na aktivní zápas…</div></div>
    <audio id="pauseAudio" src="pause.mp3?v=3" preload="auto" loop playsinline webkit-playsinline></audio>
  </div>
<script>
const FIREBASE_DB='https://bc-rybarna-scrbrd-default-rtdb.europe-west1.firebasedatabase.app';
const params=new URLSearchParams(location.search);
const hashParams=new URLSearchParams((location.hash||'').replace(/^#/,''));
const uidFromUrl=params.get('uid')||hashParams.get('uid')||'';
if(uidFromUrl){ try{ localStorage.setItem('bcOverlayUid',uidFromUrl); }catch(e){} }
let uid=uidFromUrl;
let uidSource=uidFromUrl?'URL/HASH':'';
if(!uid){
  try{
    uid=localStorage.getItem('bcOverlayUid')||'';
    if(uid)uidSource='LOCAL STORAGE';
  }catch(e){}
}

const overlay=document.getElementById('overlay');
const diag=document.getElementById('diag');
const pauseAudio=document.getElementById('pauseAudio');
const stage=document.getElementById('stage');
let lastKey='';
let lastMode='';
let lastState=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function ballClass(n){
  const stripe=n>=9;
  return `ball ${stripe?'stripe':'solid'} ${n===2||n===3||n===4||n===6||n===7||n===8?'dark':''} ball${n}`;
}
async function setPauseAudio(shouldPlay){
  if(!pauseAudio)return false;
  if(shouldPlay){
    clearInterval(setPauseAudio._fade);
    // Pokud skladba už běží, nesahej na currentTime. Firebase polling tak hudbu nerestartuje.
    if(!pauseAudio.paused && !pauseAudio.ended){
      try{ pauseAudio.muted=false; pauseAudio.volume=.72; }catch(e){}
      return true;
    }
    try{
      pauseAudio.currentTime=0;
      pauseAudio.muted=true;
      pauseAudio.volume=.72;
      await pauseAudio.play();
      setTimeout(()=>{
        try{ pauseAudio.muted=false; pauseAudio.volume=.72; }catch(e){}
      },120);
      return true;
    }catch(e){
      console.warn('Pause audio blocked:',e);
      try{ pauseAudio.muted=false; }catch(_){}
      return false;
    }
  }else{
    clearInterval(setPauseAudio._fade);
    if(pauseAudio.paused){
      try{ pauseAudio.currentTime=0; pauseAudio.volume=.72; pauseAudio.muted=false; }catch(e){}
      return true;
    }
    let v=Number(pauseAudio.volume||.72);
    setPauseAudio._fade=setInterval(()=>{
      v=Math.max(0,v-.10);
      pauseAudio.volume=v;
      if(v<=0){
        clearInterval(setPauseAudio._fade);
        pauseAudio.pause();
        pauseAudio.currentTime=0;
        pauseAudio.muted=false;
        pauseAudio.volume=.72;
      }
    },55);
    return true;
  }
}
function renderIntermission(mode){
  const content={
    pause:['PAUZA','Za chvíli pokračujeme'],
    soon:['BRZY ZAČÍNÁME','Přenos začne za chvíli'],
    end:['KONEC STREAMU','Děkujeme za sledování']
  }[mode];
  if(!content)return false;
  overlay.className='active';
  const musicMode=(mode==='pause'||mode==='soon');
  overlay.innerHTML=`<div class="intermission"><div class="intermission-card"><div class="intermission-kicker">BC RYBÁRNA</div><div class="intermission-main">${content[0]}</div><div class="intermission-sub">${content[1]}</div>${musicMode?'<div id="pauseAudioStatus" class="audio-status">AUDIO • SPOUŠTÍM…</div>':''}</div></div>`;
  if(musicMode){
    setPauseAudio(true).then(ok=>{
      const s=document.getElementById('pauseAudioStatus');
      if(s)s.textContent=ok?'AUDIO • OK':'AUDIO • BLOKOVÁNO WEBVIEW';
    });
  }else setPauseAudio(false);
  return true;
}

function renderBalls(state){
  const max=Number(state.maxBall||0);
  const remaining=Array.isArray(state.remainingBalls)?state.remainingBalls.map(Number):[];
  if(!(state.exactRackTracking && (state.discipline==='9-ball' || state.discipline==='10-ball') && max))return '';
  const set=new Set(remaining);
  const items=[];
  for(let n=1;n<=max;n++){
    const active=set.has(n);
    items.push(`<div class="ball-slot"><div class="${ballClass(n)} ${active?'':'gone'}"><span>${n}</span></div></div>`);
  }
  return `<div class="balls-wrap"><div class="balls-title">KOULE NA STOLE</div><div class="balls-row">${items.join('')}</div></div>`;
}
function render(state){
  lastState=state||null;
  if(!state || !state.active){
    setPauseAudio(false);
    lastMode='';
    overlay.className='active';
    overlay.innerHTML='<div class="offline" style="background:rgba(0,0,0,.70);padding:18px;border-radius:14px">OVERLAY BĚŽÍ • HLEDÁM AKTIVNÍ ZÁPAS</div>';
    return;
  }
  const mode=state.streamMode||'live';
  const wasMusicMode=(lastMode==='pause'||lastMode==='soon');
  const isMusicMode=(mode==='pause'||mode==='soon');
  if(mode!==lastMode){
    if(wasMusicMode && !isMusicMode)setPauseAudio(false);
    lastMode=mode;
  }
  if(mode!=='live'){renderIntermission(mode);return;}
  if(wasMusicMode)setPauseAudio(false);
  const p1=esc((state.playerNames&&state.playerNames[0])||'Hráč 1');
  const p2=esc((state.playerNames&&state.playerNames[1])||'Hráč 2');
  const sub1=esc((state.playerSubs&&state.playerSubs[0])||'');
  const sub2=esc((state.playerSubs&&state.playerSubs[1])||'');
  const title=esc(state.matchTitle||'');
  const discipline=esc(state.discipline||'');
  const target=Number(state.target||0);
  const breakModeText=esc(state.breakModeLabel||({alternate:'STŘÍDAVÝ BREAK',alternate2:'STŘÍDÁNÍ PO 2',winner:'VÍTĚZ ROZSTŘELUJE','first-only':'POUZE PRVNÍ ROZSTŘEL'}[state.breakMode]||''));
  const rackNo=Number(state.rackNumber||1);
  const score1=Number((state.scores&&state.scores[0])||0);
  const score2=Number((state.scores&&state.scores[1])||0);
  const turn=Number(state.turn||0);
  overlay.className='active';
  overlay.innerHTML=`<div class="live-wrap">
    ${title?`<div class="titlebar"><div class="titlepill">${title}</div></div>`:''}
    <div class="scoreboard">
      <div class="player ${turn===0?'turn':''}">
        <div class="identity">
          <div class="name">${p1}</div>
          ${sub1?`<div class="sub">${sub1}</div>`:''}
        </div>
        <div class="score">${score1}</div>
      </div>
      <div class="center">
        <div class="maininfo">${discipline}${target?` • RACE TO ${target}`:''}</div>
        ${breakModeText?`<div class="breakinfo">${breakModeText}</div>`:''}
        <div class="rack">RACK ${rackNo}</div>
        ${state.useClock && Number(state.clockRemaining||0)>0?`<div class="subinfo">SHOT CLOCK: ${Math.max(0,Math.ceil(Number(state.clockRemaining||0)))} s</div>`:`<div class="subinfo">BC RYBÁRNA SCOREBOARD</div>`}
      </div>
      <div class="player right ${turn===1?'turn':''}">
        <div class="identity">
          <div class="name">${p2}</div>
          ${sub2?`<div class="sub">${sub2}</div>`:''}
        </div>
        <div class="score">${score2}</div>
      </div>
      ${renderBalls(state)}
    </div>
  </div>`;
}
async function discoverActiveUid(){
  try{
    const res=await fetch(`${FIREBASE_DB}/stream/users.json?t=${Date.now()}`,{cache:'no-store'});
    if(!res.ok)return '';
    const all=await res.json()||{};
    const now=Date.now();
    const candidates=Object.entries(all)
      .filter(([id,s])=>id && s && s.active && (now-Number(s.updatedAt||0))<20000)
      .sort((a,b)=>Number(b[1]?.updatedAt||0)-Number(a[1]?.updatedAt||0));
    if(!candidates.length)return '';
    const found=candidates[0][0];
    uid=found;
    uidSource='AUTO • NEJČERSTVĚJŠÍ LIVE';
    try{ localStorage.setItem('bcOverlayUid',found); }catch(e){}
    return found;
  }catch(e){
    return '';
  }
}

async function poll(){
  try{
    if(!uid){
      await discoverActiveUid();
    }

    let state=null;
    if(uid){
      const res=await fetch(`${FIREBASE_DB}/stream/users/${encodeURIComponent(uid)}.json?t=${Date.now()}`,{cache:'no-store'});
      if(res.ok) state=await res.json();
    }

    // Pokud uložené / URL UID nemá aktivní zápas, zkus automaticky najít
    // nejčerstvější aktivní stream. To řeší staré URL, jiný účet i ztrátu UID po otočení.
    if(!state || !state.active || (Date.now()-Number(state.updatedAt||0))>=20000){
      const previousUid=uid;
      uid='';
      const found=await discoverActiveUid();
      if(found){
        if(found!==previousUid) lastKey='';
        const res2=await fetch(`${FIREBASE_DB}/stream/users/${encodeURIComponent(found)}.json?t=${Date.now()}`,{cache:'no-store'});
        if(res2.ok) state=await res2.json();
      }else{
        // Když žádný aktivní stream není, vrať původní UID pro další pokus,
        // pokud nějaké existovalo.
        uid=previousUid||'';
      }
    }

    const key=JSON.stringify(state||{});
    if(key!==lastKey){
      lastKey=key;
      render(state);
    }
  }catch(e){
    lastKey='';
    diag.textContent='OVERLAY NAČTEN • CHYBA DAT'; diag.classList.add('show');
    overlay.className='active';
    overlay.innerHTML='<div class="offline" style="background:rgba(176,0,32,.92);padding:18px;border-radius:14px">OVERLAY NAČTEN • CHYBA PŘIPOJENÍ K DATŮM</div>';
  }
}
function rerenderForViewport(){
  requestAnimationFrame(()=>{
    if(lastState)render(lastState);
    if(diag){
      diag.textContent='OVERLAY OK • '+(innerWidth>innerHeight?'LANDSCAPE':'PORTRAIT')+' • '+innerWidth+'×'+innerHeight+' • '+(lastState&&lastState.active?'DATA OK':'BEZ AKTIVNÍCH DAT')+' • UID: '+(uidSource||'—');
      diag.classList.add('show');
      clearTimeout(rerenderForViewport._hide);
      rerenderForViewport._hide=setTimeout(()=>diag.classList.remove('show'),5000);
    }
  });
}
window.addEventListener('resize',rerenderForViewport,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(rerenderForViewport,180),{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',rerenderForViewport,{passive:true});
render(null);
poll();
setInterval(poll,1000);
</script>
</body>
</html>
