name: Poolcitalo regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release version and revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release policy tests
        run: node --test tests/release-policy.test.cjs
      - name: Compare release with current remote main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          node scripts/check-release.cjs --base origin/main
      - name: Check published release against previous main
        if: github.event_name == 'push'
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: node scripts/check-release.cjs --base "$RELEASE_BASE"
  production-tests:
    name: Production Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite
        run: npm run test:production

  experimental-tests:
    name: Experimental test-modular contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every experimental assertion (failures remain visible)
        run: npm run test:experimental
