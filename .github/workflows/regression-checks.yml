name: Poolcitalo regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Node smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite
        run: npm test
