name: Poolcitalo modular checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  modular-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run smoke tests
        run: npm test
